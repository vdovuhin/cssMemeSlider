<!DOCTYPE html>
<!-- Коди мов https://html-css.co.ua/html/lang-kodu-mov/ -->
<html lang="en">

<head>
	<!-- Кодування тексту -->
	<meta charset="UTF-8">
	<!-- Налаштування в'юпорту (адаптиву, масштабу тощо) -->
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<!-- Відкрити усі вкладки в новій вкладці -->

	<!-- Підключення окремого файлу стилів -->
	<link rel="stylesheet" href="css/style.css">
	<!-- Заголовок сторінки в браузері -->
	<title>Mem slider</title>

</head>

<body>
	<div class="wrapper">
		<header class="header">
			<div class="header__container">

			</div>
		</header>
		<main class="page">
			<div class="page__container">
				<div class="page__slider">
					<input type="radio" name="slider" id="slide-1" class="input" checked>
					<input type="radio" name="slider" id="slide-2" class="input">
					<input type="radio" name="slider" id="slide-3" class="input">
					<input type="radio" name="slider" id="slide-4" class="input">
					<div class="page__items">
						<div class="page__item">
							<img class="image" src="img/01.webp" alt="Мем с котом">
						</div>
						<div class="page__item">
							<img class="image" src="img/02.webp" alt="Мем с собакой в огне">
						</div>
						<div class="page__item">
							<img class="image" src="img/03.webp" alt="Мем с котом в коробке">
						</div>
						<div class="page__item">
							<img class="image" src="img/04.webp" alt="Мем с собакой в коробке">
						</div>
					</div>
					<div class="page__inner inner">
						<p class="inner__text">Когда верстаешь слайдер на чистом CSS без единой строчки JS</p>
						<p class="inner__text">Мой макет, когда я случайно удалил одну закрывающую скобку в CSS</p>
						<p class="inner__text">Я, когда CSS Grid наконец-то заработал как надо</p>
						<p class="inner__text">Слайдер работает, а position: static остался главным боссом задачи</p>
					</div>
					<div class="page__button buttons">
						<label for="slide-1" class="button"></label>
						<label for="slide-2" class="button"></label>
						<label for="slide-3" class="button"></label>
						<label for="slide-4" class="button"></label>
					</div>
				</div>
			</div>
		</main>
		<footer class="footer">
			<div class="footer__container">

			</div>
		</footer>
	</div>

</body>

</html>
